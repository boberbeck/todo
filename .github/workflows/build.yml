name: Build und Tests

# macOS-Minuten zählen in privaten Repositories zehnfach, deshalb sparsam:
# - Änderungen nur an Doku, Screenshots oder Claude-Skills lösen keinen Build aus
# - ein neuer Push bricht den noch laufenden Build desselben Branches ab (nur der neueste zählt)
# - kein zusätzlicher Lauf für Pull Requests (der Push auf den Branch baut schon)
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Werkzeuge anzeigen
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # Kein eigener Debug-Build: „swift test“ baut, was die Tests brauchen, die App baut make-app.sh.
      - name: Testen
        run: swift test

      # Vorbereitung fürs iPhone: Der Kern muss auch für iOS bauen.
      - name: Kern für iPhone bauen
        run: |
          set -o pipefail
          xcodebuild -scheme TagwerkCore -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation build 2>&1 | tail -n 25

      # Feste Signatur aus den Secrets (scripts/signatur-einrichten.sh). Ohne Secrets wird ad hoc signiert.
      - name: Signatur vorbereiten
        env:
          SIGNING_P12: ${{ secrets.TAGWERK_SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.TAGWERK_SIGNING_PASSWORD }}
        run: |
          if [ -z "${SIGNING_P12}" ]; then
            echo "Kein Zertifikat hinterlegt, es wird ad hoc signiert."
            exit 0
          fi
          KEYCHAIN="${RUNNER_TEMP}/tagwerk-signatur.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          printf '%s' "${SIGNING_P12}" | base64 --decode > "${RUNNER_TEMP}/tagwerk.p12"
          security import "${RUNNER_TEMP}/tagwerk.p12" -k "${KEYCHAIN}" -P "${SIGNING_PASSWORD}" -T /usr/bin/codesign
          rm -f "${RUNNER_TEMP}/tagwerk.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" >/dev/null
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "${KEYCHAIN}"

      - name: App-Bundle bauen
        run: scripts/make-app.sh release

      # Startet den MCP-Server mit einer leeren Datenbank und spricht ihn an wie Claude.
      - name: MCP-Server prüfen
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"aufgabe_anlegen","arguments":{"titel":"Test aus CI 30m","datum":"heute"}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"tagesuebersicht","arguments":{}}}' \
            | TAGWERK_DB="$RUNNER_TEMP/mcp-test.sqlite" build/Tagwerk.app/Contents/MacOS/tagwerk-mcp > mcp-output.txt
          cat mcp-output.txt
          grep -q '"protocolVersion":"2025-06-18"' mcp-output.txt
          grep -q 'tagesuebersicht' mcp-output.txt
          grep -q 'Test aus CI' mcp-output.txt
          test "$(wc -l < mcp-output.txt)" -eq 4

      # Derselbe Server über HTTP, wie ihn Claude im Browser oder auf dem Handy über einen Tunnel anspricht.
      - name: MCP über HTTP prüfen
        run: |
          export TAGWERK_DB="$RUNNER_TEMP/mcp-http.sqlite" TAGWERK_HTTP_TOKEN="ci-geheim-0123456789abcdef"
          build/Tagwerk.app/Contents/MacOS/tagwerk-mcp --http 8799 2> http-log.txt &
          PID=$!
          for i in $(seq 1 50); do curl -s -o /dev/null http://127.0.0.1:8799/ && break; sleep 0.2; done
          URL="http://127.0.0.1:8799/mcp/$TAGWERK_HTTP_TOKEN"
          curl -s -i -X POST "$URL" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | tee http-init.txt
          grep -qi '^mcp-session-id:' http-init.txt
          grep -q '"protocolVersion":"2025-06-18"' http-init.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL" -d '{"jsonrpc":"2.0","method":"notifications/initialized"}')" = 202
          curl -s -X POST "$URL" -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | grep -q 'unteraufgabe_von'
          curl -s -X POST "$URL" -d '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"aufgabe_anlegen","arguments":{"titel":"Vom Handy"}}}' | grep -q 'Vom Handy'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8799/mcp/falsch -d '{}')" = 404
          kill $PID
          cat http-log.txt

      # Startet die App mit Beispieldaten. Sie zeigt jeden Bildschirm hell und dunkel und meldet sich
      # jeweils über die Datei .ready; dieses Skript fotografiert dann das Fenster.
      - name: Screenshots aufnehmen
        run: |
          mkdir -p screenshots
          open -n build/Tagwerk.app --args -TagwerkSnapshotDir "$PWD/screenshots" -AppleLanguages '(de)' -AppleLocale de_DE
          for i in $(seq 1 1200); do
            if [ -f screenshots/.ready ]; then
              read -r NAME WID < screenshots/.ready
              if [ "$WID" = "0" ]; then
                screencapture -x "screenshots/$NAME.png" || echo "screencapture fehlgeschlagen: $NAME"
              else
                screencapture -x -o -l"$WID" "screenshots/$NAME.png" || echo "screencapture fehlgeschlagen: $NAME"
              fi
              rm -f screenshots/.ready
            fi
            [ -f screenshots/.done ] && break
            sleep 0.2
          done
          rm -f screenshots/.done screenshots/.ready
          pkill -x Tagwerk || true
          ls -la screenshots
          echo "--- Protokoll der App ---"
          cat screenshots/protokoll.txt 2>/dev/null || echo "(kein Protokoll)"

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn

      # Fertige App zum Herunterladen: als ZIP am Lauf und als Release „aktuell“.
      - name: App packen
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Tagwerk.app build/Tagwerk.zip
          ls -la build/Tagwerk.zip

      - name: DMG bauen
        run: |
          scripts/make-dmg.sh
          # Probe: DMG öffnen, App und Verknüpfung müssen drin sein
          MOUNT="$RUNNER_TEMP/dmg-probe"
          mkdir -p "$MOUNT"
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$MOUNT" build/Tagwerk.dmg
          ls -la "$MOUNT"
          test -x "$MOUNT/Tagwerk.app/Contents/MacOS/Tagwerk"
          test -x "$MOUNT/Tagwerk.app/Contents/MacOS/tagwerk-mcp"
          test -L "$MOUNT/Programme"
          codesign --verify --deep --strict "$MOUNT/Tagwerk.app" && echo "Signatur der App in der DMG ist gültig"
          hdiutil detach -quiet "$MOUNT"

      - uses: actions/upload-artifact@v4
        with:
          name: Tagwerk-App
          path: |
            build/Tagwerk.dmg
            build/Tagwerk.zip

      # Nur bei Bedarf: Commit-Nachricht mit [screenshots] oder manueller Start. Vor dem Release, damit die Bilder auch kommen,
      # wenn GitHub beim Release hakt.
      - name: Screenshots ins Repository legen
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')
        run: |
          rm -rf docs/screenshots
          mkdir -p docs/screenshots
          cp screenshots/*.png docs/screenshots/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/screenshots
          if git diff --cached --quiet; then
            echo "Keine neuen Screenshots"
          else
            git commit -m "Screenshots aktualisieren [skip ci]"
            # Kam während des Builds ein neuer Commit dazu, die Screenshots obendrauf setzen
            git push || { git pull --rebase origin "${GITHUB_REF_NAME}" && git push; } || echo "Push nicht möglich, der Branch hat sich inzwischen geändert"
          fi

      - name: Release „aktuell“ aktualisieren
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Automatisch gebaut aus ${GITHUB_REF_NAME} (${GITHUB_SHA::7}) am $(date -u '+%d.%m.%Y %H:%M') UTC.

          Installieren: Tagwerk.dmg laden und öffnen, Tagwerk auf „Programme“ ziehen (ältere Fassung ersetzen).
          Tagwerk.zip ist dasselbe als ZIP.
          Beim ersten Öffnen blockt macOS die App, weil sie nicht von Apple beglaubigt ist:
          Systemeinstellungen › Datenschutz & Sicherheit › „Dennoch öffnen“.
          Oder im Terminal: xattr -dr com.apple.quarantine /Applications/Tagwerk.app"
          # GitHub antwortet manchmal kurz mit Fehler 500; dann ohne Release dazustehen wäre schlecht (die App findet kein Update).
          for attempt in 1 2 3 4 5; do
            gh release delete aktuell --yes --cleanup-tag 2>/dev/null || true
            if gh release create aktuell build/Tagwerk.dmg build/Tagwerk.zip --prerelease --target "$GITHUB_SHA" --title "Tagwerk – aktueller Stand" --notes "$NOTES"; then
              exit 0
            fi
            echo "Release anlegen fehlgeschlagen (Versuch $attempt), neuer Versuch in $((attempt * 20)) Sekunden"
            sleep $((attempt * 20))
          done
          exit 1
