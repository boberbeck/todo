name: Build und Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge anzeigen
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Bauen
        run: swift build

      - name: Testen
        run: swift test
